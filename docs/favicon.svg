<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo preto cinema sólido e sem cantos arredondados -->
  <rect width="64" height="64" fill="#090a0c" />
  
  <!-- Borda técnica sutil -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#22252e" stroke-width="2" />
  
  <!-- Detalhe da claquete / listras diagonais no topo -->
  <rect x="6" y="6" width="52" height="12" fill="#16191f" />
  <path d="M12 18 L18 6 M24 18 L30 6 M36 18 L42 6 M48 18 L54 6" stroke="#e50914" stroke-width="2.5" stroke-linecap="square" />

  <!-- Triângulo de Play central em Vermelho Cinema autêntico -->
  <polygon points="26,26 44,37 26,48" fill="#e50914" />
</svg>
